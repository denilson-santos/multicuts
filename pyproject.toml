[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicuts"
version = "0.1.0"
description = "Turn long videos into ranked, subtitled short and long clips."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "typer>=0.27.2,<0.28",
    "yt-dlp>=2025.1,<2027",
    "multisubs[whisperx] @ https://github.com/denilson-santos/multisubs/releases/download/v4.4.1/multisubs-4.4.1-py3-none-any.whl#sha256=ab36895e6c9326da7bd3e4ff5a9e04227d0c3b6536ea9ca3fe04c3c3a88624a3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
multicuts = "multicuts.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
# Markdown contains conceptual snippets that are not executable project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires external tools, services, or non-hermetic resources",
]
