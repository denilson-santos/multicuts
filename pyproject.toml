[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicuts"
version = "0.0.0"
description = "Turn long-form videos into ranked, subtitled short clips."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "multisubs[whisperx] @ https://github.com/denilson-santos/multisubs/releases/download/v4.2.0/multisubs-4.2.0-py3-none-any.whl#sha256=1f7cf94c1cd123974a1173e1bc05812b5152e7e0b27df7fb05f132e8b830ce5c",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
multicuts = "multicuts.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
# Markdown contains conceptual snippets that are not executable project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires external tools, services, or non-hermetic resources",
]
