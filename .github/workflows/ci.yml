name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Verify SemVer
        run: python scripts/verify_version.py

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and development tools
        run: |
          .venv/bin/python -m pip install --editable ".[dev]" --no-deps
          .venv/bin/python -m pip install "pyright>=1.1,<2" "pytest>=8,<9" "ruff>=0.9,<1" "typer>=0.27.3,<0.28"

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Type check
        run: .venv/bin/pyright

  tests:
    name: Hermetic tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and test dependencies
        run: |
          .venv/bin/python -m pip install --editable ".[dev]" --no-deps
          .venv/bin/python -m pip install "pytest>=8,<9" "typer>=0.27.3,<0.28"

      - name: Run hermetic tests including recovery and acceptance
        run: .venv/bin/python -m pytest -m "not integration" -ra

  provisioned:
    name: Provisioned contracts (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pinned FFmpeg 9.0.2 and ffprobe
        shell: bash
        env:
          FFMPEG_RELEASE: autobuild-2026-09-30-13-08
          FFMPEG_BUILD: n9.0.2-17-g2a571b6068-20260930
          FFMPEG_ARCHIVE_ROOT: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0
          FFMPEG_SHA256: 68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269
        run: |
          archive_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_ARCHIVE_ROOT.tar.xz"
          archive_path="$RUNNER_TEMP/ffmpeg.tar.xz"
          bin_dir="$RUNNER_TEMP/ffmpeg/bin"
          curl --fail --location --retry 3 --output "$archive_path" "$archive_url"
          echo "$FFMPEG_SHA256  $archive_path" | sha256sum --check --status
          mkdir -p "$bin_dir"
          tar -xJf "$archive_path" --directory "$bin_dir" --strip-components=2 \
            --no-same-owner "$FFMPEG_ARCHIVE_ROOT/bin/ffmpeg" "$FFMPEG_ARCHIVE_ROOT/bin/ffprobe"
          for tool in ffmpeg ffprobe; do
            "$bin_dir/$tool" -version > "$RUNNER_TEMP/$tool-version.txt"
            grep -Fq "$tool version $FFMPEG_BUILD " "$RUNNER_TEMP/$tool-version.txt"
          done
          "$bin_dir/ffmpeg" -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          grep -q ' subtitles ' "$RUNNER_TEMP/ffmpeg-filters.txt"
          "$bin_dir/ffmpeg" -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q ' libx264 ' "$RUNNER_TEMP/ffmpeg-encoders.txt"
          cat > "$bin_dir/ffmpeg-build.json" <<EOF
          {
            "build": "$FFMPEG_BUILD",
            "release": "$FFMPEG_RELEASE",
            "url": "$archive_url",
            "sha256": "$FFMPEG_SHA256"
          }
          EOF
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Generate the small real-media fixture
        run: |
          mkdir -p src/multicuts/data
          ffmpeg -hide_banner -loglevel error -nostdin \
            -f lavfi -i color=c=black:s=1920x1080:r=25:d=3 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 3 -c:v mpeg4 -q:v 5 -c:a aac -shortest \
            src/multicuts/data/test-horizontal.mp4

      - name: Create verification environment
        run: python -m venv .venv

      - name: Install build and test tools
        run: |
          .venv/bin/python -m pip install "build>=1.2,<2" "pytest>=8,<9"

      - name: Build controlled distributions and smoke-test outside the checkout
        env:
          DIST_CHECK_DIR: ${{ runner.temp }}/multicuts-distributions
        run: |
          .venv/bin/python scripts/verify_release_builds.py \
            --project-root "$GITHUB_WORKSPACE" \
            --work-dir "$DIST_CHECK_DIR"

      - name: Install the built wheel with resolved dependencies
        env:
          DIST_CHECK_DIR: ${{ runner.temp }}/multicuts-distributions
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        run: |
          python -m venv "$PROVISIONED_VENV"
          wheel=$(find "$DIST_CHECK_DIR/build-1/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          "$PROVISIONED_VENV/bin/python" -m pip install "$wheel" "pytest>=8,<9"
          "$PROVISIONED_VENV/bin/python" -m pip check

      - name: Require the provisioned multisubs contract
        env:
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        run: |
          "$PROVISIONED_VENV/bin/python" - <<'PY'
          import importlib.metadata
          from pathlib import Path

          import multicuts
          import multisubs

          checkout = Path.cwd().resolve()
          if Path(multicuts.__file__).resolve().is_relative_to(checkout):
              raise SystemExit("provisioned checks imported multicuts from the checkout")
          version = importlib.metadata.version("multisubs")
          parts = version.split(".")
          if (
              len(parts) < 2
              or not all(part.isdigit() for part in parts[:2])
              or parts[0] != "5"
          ):
              raise SystemExit(f"unsupported provisioned multisubs version: {version}")
          print(f"multisubs {version} is provisioned")
          PY

      - name: Record provider and media versions
        env:
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        run: |
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/commit.txt
          "$PROVISIONED_VENV/bin/python" -VV > release-evidence/python.txt
          "$PROVISIONED_VENV/bin/python" -m pip freeze --all > release-evidence/packages.txt
          ffmpeg -version > release-evidence/ffmpeg.txt
          ffprobe -version > release-evidence/ffprobe.txt
          cp "$RUNNER_TEMP/ffmpeg/bin/ffmpeg-build.json" release-evidence/ffmpeg-build.json
          ffmpeg -filters > release-evidence/ffmpeg-filters.txt
          grep -q ' subtitles ' release-evidence/ffmpeg-filters.txt

      - name: Run provisioned provider and media checks
        env:
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        working-directory: ${{ github.workspace }}
        run: |
          unset PYTHONPATH
          "$PROVISIONED_VENV/bin/python" -m pytest \
            tests/contract/test_multisubs_public_api.py \
            tests/integration/test_media_probe.py \
            tests/integration/test_multisubs_timed_cue_integration.py \
            tests/integration/test_multisubs_contract.py \
            tests/integration/test_youtube_live.py \
            -ra --junitxml=release-evidence/contracts.xml
          "$PROVISIONED_VENV/bin/python" -m pytest \
            tests/integration/test_render_ffmpeg.py \
            -ra --junitxml=release-evidence/rendering.xml

      - name: Upload provisioned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-provisioned-${{ github.sha }}
          path: |
            release-evidence/
            ${{ runner.temp }}/multicuts-distributions/release-builds.json
            ${{ runner.temp }}/multicuts-distributions/build-constraints.txt
            ${{ runner.temp }}/multicuts-distributions/build-*/dist/*
            ${{ runner.temp }}/multicuts-distributions/build-*/raw/*
