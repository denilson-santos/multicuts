name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and development tools
        run: |
          .venv/bin/python -m pip install --editable ".[dev]" --no-deps
          .venv/bin/python -m pip install "build>=1.2,<2" "pyright>=1.1,<2" "pytest>=8,<9" "ruff>=0.9,<1"

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Type check
        run: .venv/bin/pyright

      - name: Run hermetic tests
        run: .venv/bin/python -m pytest -m "not integration"

      - name: Build distributions
        run: .venv/bin/python -m build

  compatibility:
    name: Compatibility (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and test tool
        run: |
          .venv/bin/python -m pip install --editable ".[dev]" --no-deps
          .venv/bin/python -m pip install "pytest>=8,<9"

      - name: Run hermetic tests
        run: .venv/bin/python -m pytest -m "not integration"
