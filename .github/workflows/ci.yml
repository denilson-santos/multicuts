name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Run hermetic tests
        run: python -m pytest -m "not integration"

      - name: Build distributions
        run: python -m build

  compatibility:
    name: Compatibility (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Run hermetic tests
        run: python -m pytest -m "not integration"
