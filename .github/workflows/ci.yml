name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and development tools
        run: |
          .venv/bin/python -m pip install --editable ".[dev]" --no-deps
          .venv/bin/python -m pip install "build>=1.2,<2" "pyright>=1.1,<2" "pytest>=8,<9" "ruff>=0.9,<1" "typer>=0.27.2,<0.28"

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Type check
        run: .venv/bin/pyright

      - name: Run hermetic tests
        run: .venv/bin/python -m pytest -m "not integration"

      - name: Build distributions
        run: .venv/bin/python -m build

  compatibility:
    name: Compatibility (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and test tool
        run: |
          .venv/bin/python -m pip install --editable ".[dev]" --no-deps
          .venv/bin/python -m pip install "pytest>=8,<9" "typer>=0.27.2,<0.28"

      - name: Run hermetic tests
        run: .venv/bin/python -m pytest -m "not integration"

  provisioned:
    name: Provisioned contracts (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Create verification environment
        run: python -m venv .venv

      - name: Install build and test tools
        run: |
          .venv/bin/python -m pip install "build>=1.2,<2" "pytest>=8,<9"

      - name: Build and smoke-test distributions outside the checkout
        env:
          DIST_CHECK_DIR: ${{ runner.temp }}/multicuts-distributions
        run: |
          .venv/bin/python scripts/verify_distributions.py \
            --project-root "$GITHUB_WORKSPACE" \
            --work-dir "$DIST_CHECK_DIR" \
            --python "$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Install the built wheel with resolved dependencies
        env:
          DIST_CHECK_DIR: ${{ runner.temp }}/multicuts-distributions
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        run: |
          python -m venv "$PROVISIONED_VENV"
          wheel=$(find "$DIST_CHECK_DIR/source-dist" -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          "$PROVISIONED_VENV/bin/python" -m pip install "$wheel" "pytest>=8,<9"
          "$PROVISIONED_VENV/bin/python" -m pip check

      - name: Require the provisioned multisubs contract
        env:
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        run: |
          "$PROVISIONED_VENV/bin/python" - <<'PY'
          import importlib.metadata
          from pathlib import Path

          import multicuts
          import multisubs

          checkout = Path.cwd().resolve()
          if Path(multicuts.__file__).resolve().is_relative_to(checkout):
              raise SystemExit("provisioned checks imported multicuts from the checkout")
          version = importlib.metadata.version("multisubs")
          parts = version.split(".")
          if (
              len(parts) < 2
              or not all(part.isdigit() for part in parts[:2])
              or parts[0] != "4"
              or int(parts[1]) < 3
          ):
              raise SystemExit(f"unsupported provisioned multisubs version: {version}")
          print(f"multisubs {version} is provisioned")
          PY

      - name: Run provisioned provider and media checks
        env:
          PROVISIONED_VENV: ${{ runner.temp }}/multicuts-provisioned
        working-directory: ${{ github.workspace }}
        run: |
          unset PYTHONPATH
          "$PROVISIONED_VENV/bin/python" -m pytest \
            tests/contract/test_multisubs_public_api.py \
            tests/integration/test_media_probe.py \
            tests/integration/test_multisubs_timed_cue_integration.py \
            tests/integration/test_multisubs_contract.py \
            tests/integration/test_youtube_live.py
          "$PROVISIONED_VENV/bin/python" -m pytest \
            tests/integration/test_clip_rendering_ffmpeg.py \
            -k "subtitle_rendering or pipeline_publishes"
